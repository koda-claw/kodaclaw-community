name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.release.outputs.upload_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        id: release
        with:
          generate_release_notes: true
          draft: false
          prerelease: false

  build-release:
    needs: create-release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Set binary extension
        run: |
          if [ "${{ matrix.goos }}" = "windows" ]; then
            echo "EXT=.exe" >> $GITHUB_ENV
          else
            echo "EXT=" >> $GITHUB_ENV
          fi

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-s -w" -o kc-community${{ env.EXT }} ./cmd/cli/
          go build -ldflags="-s -w" -o kc-server${{ env.EXT }} ./cmd/server/

      - name: Package (Unix)
        if: matrix.goos != 'windows'
        run: |
          chmod +x kc-community kc-server
          tar czf kodaclaw-community-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz kc-community kc-server

      - name: Package (Windows)
        if: matrix.goos == 'windows'
        run: |
          7z a kodaclaw-community-${{ matrix.goos }}-${{ matrix.goarch }}.zip kc-community.exe kc-server.exe

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            kodaclaw-community-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
            kodaclaw-community-${{ matrix.goos }}-${{ matrix.goarch }}.zip
