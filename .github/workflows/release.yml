name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build CLI
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -ldflags="-s -w" -o kc-community ./cmd/cli/

      - name: Build Server
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -ldflags="-s -w" -o kc-server ./cmd/server/

      - name: Package (Unix)
        if: matrix.goos != 'windows'
        run: |
          chmod +x kc-community kc-server
          tar czf kodaclaw-community-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz kc-community kc-server

      - name: Package (Windows)
        if: matrix.goos == 'windows'
        run: |
          7z a kodaclaw-community-${{ matrix.goos }}-${{ matrix.goarch }}.zip kc-community.exe kc-server.exe

      - name: Upload Artifact (Unix)
        if: matrix.goos != 'windows'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: kodaclaw-community-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
          asset_name: kodaclaw-community-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
          asset_content_type: application/gzip

      - name: Upload Artifact (Windows)
        if: matrix.goos == 'windows'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: kodaclaw-community-${{ matrix.goos }}-${{ matrix.goarch }}.zip
          asset_name: kodaclaw-community-${{ matrix.goos }}-${{ matrix.goarch }}.zip
          asset_content_type: application/zip

  create-release:
    needs: []
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
