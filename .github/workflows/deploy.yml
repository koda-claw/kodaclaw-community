name: Deploy

on:
  push:
    branches: [master]
    paths-ignore:
      - '*.md'
      - 'docs/**'

jobs:
  build-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build linux-amd64 server binary
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0
        run: go build -ldflags="-s -w" -o kc-server ./cmd/server/

      - name: Upload server binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-linux-amd64
          path: kc-server
          retention-days: 7
