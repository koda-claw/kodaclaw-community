name: Deploy

on:
  push:
    branches: [master]
    paths-ignore:
      - '*.md'
      - 'docs/**'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build linux-amd64 server binary
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0
        run: go build -ldflags="-s -w" -o kc-server ./cmd/server/

      - name: Get current commit SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Upload to Deploy Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Delete existing deploy release if present
          gh release delete deploy --yes 2>/dev/null || true
          git push origin :refs/tags/deploy 2>/dev/null || true
          
          # Create lightweight tag
          git tag -f deploy
          git push -f origin deploy
          
          # Create release and upload binary
          gh release create deploy \
            kc-server \
            --title "Server Build" \
            --notes "Auto-built from commit ${{ steps.sha.outputs.short }}" \
            --target master \
            --prerelease
